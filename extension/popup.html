<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 320px; font-family: sans-serif; padding: 10px; text-align: center; }
    button { padding: 10px; width: 100%; color: white; border: none; border-radius: 4px; cursor: pointer; }
    #startBtn { background: #007bff; }
    #disconnectBtn { display: none; margin-top: 8px; background: #dc3545; }
    #status { margin-top: 10px; font-size: 12px; color: #555; }
    #clearLogBtn { margin-top: 8px; padding: 6px; background: #6c757d; font-size: 11px; }
    #activityLog { max-height: 180px; margin: 8px 0 0; padding: 6px; overflow: auto; background: #f4f4f4; color: #222; text-align: left; font: 10px/1.35 monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h3>GPT Live Page Control</h3>
  <p style="margin: 0; font-size: 11px; color: #444;">Speak a browser action: open a site, switch tabs, click, type, or fill a form.</p>
  <button id="startBtn">Connect Voice</button>
  <button id="disconnectBtn">Disconnect</button>
  <div id="status">Disconnected</div>
  <div id="liveHint" style="display:none; margin-top:6px; font-size:11px; color:#555;">Voice stays on after you close this popup. Click Disconnect to stop listening and speaking.</div>
  <button id="clearLogBtn">Clear activity log</button>
  <pre id="activityLog">No activity yet.</pre>
  <script src="popup.js"></script>
</body>
</html>
